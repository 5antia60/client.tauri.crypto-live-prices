<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .box { fill: #f5f7fb; stroke: #2b6cb0; stroke-width: 2px; rx: 8px; }
    .title { font: 600 18px 'Segoe UI', Roboto, Arial; fill: #0b3b66; }
    .label { font: 400 14px 'Segoe UI', Roboto, Arial; fill: #102a43; }
    .small { font: 400 12px 'Segoe UI', Roboto, Arial; fill: #334e68; }
    .arrow { stroke: #334e68; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68" />
    </marker>
  </defs>

  <!-- Frontend block -->
  <rect x="40" y="60" width="360" height="220" class="box" />
  <text x="220" y="90" text-anchor="middle" class="title">Frontend</text>
  <text x="220" y="115" text-anchor="middle" class="small">React + TypeScript (src/)</text>
  <text x="90" y="150" class="label">• UI Components</text>
  <text x="90" y="175" class="small">Header, CryptoList, SearchBar, Settings</text>
  <text x="90" y="205" class="label">• localStorage (cryptotray_prefs)</text>
  <text x="90" y="230" class="label">• CoinGecko client (src/api.ts)</text>

  <!-- WebView block -->
  <rect x="460" y="60" width="260" height="120" class="box" />
  <text x="590" y="90" text-anchor="middle" class="title">Tauri WebView</text>
  <text x="590" y="115" text-anchor="middle" class="small">Embedded browser hosting the React app</text>

  <!-- Native block -->
  <rect x="760" y="60" width="360" height="220" class="box" />
  <text x="940" y="90" text-anchor="middle" class="title">Native runtime</text>
  <text x="940" y="115" text-anchor="middle" class="small">Rust (src-tauri/)</text>
  <text x="820" y="150" class="label">• Tray & Menu (tray.rs)</text>
  <text x="820" y="175" class="label">• Window lifecycle & positioning</text>
  <text x="820" y="200" class="label">• IPC / commands (lib.rs)</text>

  <!-- CoinGecko block -->
  <rect x="460" y="360" width="360" height="100" class="box" />
  <text x="640" y="395" text-anchor="middle" class="title">CoinGecko API</text>
  <text x="640" y="420" text-anchor="middle" class="small">Public REST API (rates, images, search)</text>

  <!-- Arrows -->
  <line x1="400" y1="170" x2="460" y2="170" class="arrow" />
  <text x="430" y="160" class="small" text-anchor="middle">runs inside</text>

  <line x1="720" y1="170" x2="760" y2="170" class="arrow" />
  <text x="740" y="160" class="small" text-anchor="middle">IPC (invoke/listen)</text>

  <line x1="590" y1="200" x2="590" y2="360" class="arrow" />
  <text x="620" y="280" class="small">HTTPS requests</text>

  <line x1="640" y1="460" x2="640" y2="480" stroke="#bbb" stroke-dasharray="4 4" />
  <text x="640" y="498" text-anchor="middle" class="small">public API / rate limits</text>

  <!-- Footer note -->
  <text x="40" y="680" class="small">Diagram: high-level component blocks and main interactions. For implementation details see responsibility map in the README.</text>
</svg>
